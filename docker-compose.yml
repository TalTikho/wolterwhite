services:
  # ─── SERVER SERVICE ───
  wolterwhite-server:
    build: 
      context: .
      dockerfile: Dockerfile.server
    container_name: wolterwhite_server_container
    ports:
      - "5555:5555"
    volumes:
      - ./data:/usr/src/wolterwhite/build/data
    restart: unless-stopped

  # ─── MONGO SERVICE ───
  wolterwhite-mongo:
    image: mongo:7
    container_name: wolterwhite_mongo_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  wolterwhite-web:
      build:
        context: ./webServer
        dockerfile: Dockerfile.web
      container_name: wolterwhite_web_container
      ports:
      - "5000:5000"
      environment:
      - SERVER_HOST=wolterwhite-server 
      - SERVER_PORT=5555 
      - MONGO_URI=mongodb://wolterwhite-mongo:27017/wolterwhite
      depends_on:
        - wolterwhite-server
        - wolterwhite-mongo
      volumes:
        - uploads-data:/app/uploads
      restart: unless-stopped
  wolterwhite-front:
      build:
        context: ./frontend
        dockerfile: Dockerfile.front
      container_name: wolterwhite_front_container
      ports:
        - "3000:3000"
      environment:
        #Default to relative routing
        - REACT_APP_API_BASE_URL=
        - ALLOWED_HOSTS=all
      restart: unless-stopped
  # ─── CLIENT SERVICE ───
  wolterwhite-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: wolterwhite_client_container
    environment:
      - SERVER_HOST=wolterwhite-server
      - SERVER_PORT=5555 # Force it to talk to the server on port 5555
    stdin_open: true
    tty: true
    depends_on:
      - wolterwhite-server
    command: tail -f /dev/null

volumes:
  mongo-data:
  uploads-data: